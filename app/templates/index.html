<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de neumonía en radiografías de tórax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script defer src="/static/js/scripts.js"></script>
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center">Detección de neumonía en radiografías de tórax</h2>
        <div class="mb-4"></div>
        <!-- Área de subida -->
        <div class="row justify-content-center mb-4">
            <div class="w-100">
                <div id="uploadArea" class="upload-area">
                    <i class="bi bi-upload fs-1 text-secondary"></i>
                    <p class="mb-2 fw-semibold">Arrastra tu imagen aquí</p>
                    <p class="text-muted small">o</p>
                    <label for="fileInput" class="btn btn-primary">Seleccionar archivo</label>
                    <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg" hidden>
                </div>
            </div>
        </div>
        <div class="mb-4"></div>
        <!-- Vista de predicción -->
        <div class="row g-4">
            <!-- Panel izquierdo -->
            <div class="col-lg-3">
                <div class="fixed-square" id="imageContainer"></div>
            </div>
            <!-- Panel derecho -->
            <div class="col-lg-9">
                <div class="h-100 result-card">
                    <button class="btn btn-primary w-100 mb-3 p-3" id="btn-predecir">Predecir</button>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Resultado</label>
                        <input type="text" class="form-control" id="resultado" value="" readonly>
                    </div>
                    <div>
                        <label class="form-label fw-semibold">Probabilidad de confianza</label>
                        <input type="text" class="form-control" id="probabilidad" value="" readonly>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="cnnNeumoniaModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="cnnNeumoniaModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="d-flex justify-content-center p-4">
                        <div class="spinner-grow" style="width: 5rem; height: 5rem;" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
